name: Deploy Remix prerender to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Remix for Cloudflare
        run: npm run build

      - name: Prerender Remix for GitHub Pages
        run: node scripts/prerender-github.mjs
        env:
          SESSION_SECRET: github-pages-prerender-build-only-secret

      - name: Verify GitHub Pages output
        run: |
          test -f build/github-pages/index.html
          test -f build/github-pages/404.html
          test -f build/github-pages/articles/index.html
          test -f build/github-pages/projects/sangfroid/index.html

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/github-pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
